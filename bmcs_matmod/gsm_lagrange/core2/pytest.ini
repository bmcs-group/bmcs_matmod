[tool:pytest]
# pytest configuration for GSM Lagrange core2 tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    roundtrip: marks tests that specifically test round-trip consistency
    constitutive: marks tests that specifically test constitutive relations
